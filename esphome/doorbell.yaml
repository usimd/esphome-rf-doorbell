# ESP32-C6 intercom: always-connected Thread SED with automatic light sleep.
# Requires ESPHome 2026.11.0b3 (see requirements.txt).
esphome:
  name: esphome-rf-doorbell
  friendly_name: Doorbell
  min_version: 2026.11.0b3
  on_boot:
    priority: -100
    then:
      # Template numbers publish restored values without running set_action.
      - openthread.set_poll_period:
          poll_period: !lambda 'return static_cast<uint32_t>(id(thread_poll_period).state * 1000);'
      - binary_sensor.template.publish:
          id: bell_signal
          state: false
      - component.update: charger_controller
      - component.update: fuel_gauge
      - if:
          condition:
            binary_sensor.is_on: bell_signal_gpio
          then:
            - script.execute: handle_doorbell_press
      - if:
          condition:
            binary_sensor.is_on: battery_alert_pin
          then:
            - script.execute: handle_battery_alert

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  framework:
    type: esp-idf
    version: recommended

network:
  enable_ipv6: true
  enable_ipv4: false

openthread:
  device_type: MTD
  tlv: !secret thread_tlv
  poll_period: 5s
  output_power: 20

power_management:
  - platform: esp32_power_management
    enable_light_sleep: true
    # Validate I2C/ADC/SPI after sleep before enabling peripheral power-down.
    power_down_peripherals: false

logger:
  level: INFO
  baud_rate: 115200
  hardware_uart: UART0

time:
  - platform: homeassistant
    id: esphome_time

api:
  # Preserve physical outputs during a border-router/HA outage.
  reboot_timeout: 0s
  encryption:
    key: !secret doorbell_api_encryption_key

ota:
  - platform: esphome
    password: !secret doorbell_ota_password
    on_begin:
      - globals.set:
          id: ota_active
          value: 'true'
      - openthread.set_poll_period:
          poll_period: 0s
    on_error:
      - globals.set:
          id: ota_active
          value: 'false'
      - openthread.set_poll_period:
          poll_period: !lambda 'return static_cast<uint32_t>(id(thread_poll_period).state * 1000);'
    on_abort:
      - globals.set:
          id: ota_active
          value: 'false'
      - openthread.set_poll_period:
          poll_period: !lambda 'return static_cast<uint32_t>(id(thread_poll_period).state * 1000);'

globals:
  - id: ota_active
    type: bool
    restore_value: false
    initial_value: 'false'

number:
  - platform: template
    id: thread_poll_period
    name: "Thread Poll Period"
    entity_category: config
    unit_of_measurement: s
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 5
    restore_value: true
    optimistic: true
    update_interval: never
    set_action:
      - if:
          condition:
            lambda: 'return !id(ota_active);'
          then:
            - openthread.set_poll_period:
                poll_period: !lambda 'return static_cast<uint32_t>(x * 1000);'

external_components:
  - source:
      type: local
      path: components
    components: [max17260, doorbell_controller]

i2c:
  sda: GPIO13
  scl: GPIO12
  frequency: 100kHz

spi:
  clk_pin: GPIO19
  mosi_pin: GPIO21
  miso_pin: GPIO20

sx126x:
  id: lora_transceiver
  cs_pin: GPIO18
  rst_pin: GPIO23
  dio1_pin: GPIO3
  busy_pin: GPIO22
  frequency: 868000000
  hw_version: sx1262
  modulation: LORA
  pa_power: 14
  rf_switch: true
  tcxo_voltage: 1_8V
  tcxo_delay: 5ms
  bandwidth: 125_0kHz
  spreading_factor: 7
  coding_rate: CR_4_5
  crc_enable: true
  sync_value: [0x14, 0x24]
  preamble_size: 8
  rx_start: false
  on_packet:
    then:
      - logger.log:
          format: "LoRa packet received: RSSI=%.1f dBm, SNR=%.1f dB"
          args: ['rssi', 'snr']
      - if:
          condition:
            lambda: 'return x.size() >= 1 && x[0] == 0x01;'
          then:
            - switch.turn_on: door_opener
            - homeassistant.action:
                service: notify.notify
                data:
                  title: "Doorbell"
                  message: "Door opened via LoRa remote"
      - if:
          condition:
            lambda: 'return x.size() >= 1 && x[0] == 0x10;'
          then:
            - script.execute: handle_doorbell_press

doorbell_controller:
  id: charger_controller
  address: 0x50
  update_interval: 60s
  r_high: 820000
  r_low: 120000
  digipot_resistance: 100000
  supply_divider_ratio: 11.0
  r_prog: 20000
  charge_disable_pin:
    number: GPIO7
    inverted: true
  supply_sense_enable_pin: GPIO6
  supply_adc_pin: 0
  vprog_adc_pin: 1
  bell_wakeup_pin:
    number: GPIO4
    mode: INPUT_PULLDOWN
    allow_other_uses: true
  battery_alert_wakeup_pin:
    number: GPIO2
    mode: INPUT_PULLUP
    inverted: true
    allow_other_uses: true
  vindpm_threshold:
    name: "VINDPM Threshold"
  charging_enabled:
    name: "Battery Charging Enable"
    disabled_by_default: true
  bell_mute:
    id: bell_mute
    name: "Bell Mute"
    restore_mode: RESTORE_DEFAULT_OFF
    pin: GPIO5
  supply_voltage:
    name: "Supply Voltage"
  charge_current:
    name: "Charge Current"
  wiper_value:
    name: "Digipot Wiper Value"
    disabled_by_default: true

max17260:
  id: fuel_gauge
  address: 0x36
  update_interval: 20min
  state_of_charge:
    name: "Battery Percentage"

binary_sensor:
  - platform: template
    name: "Bell Signal"
    id: bell_signal

  - platform: gpio
    name: "Battery Alert"
    id: battery_alert_pin
    disabled_by_default: true
    # GPIO wake shares its level-trigger type with normal GPIO interrupts.
    use_interrupt: false
    pin:
      number: GPIO2
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    on_state:
      - lambda: 'id(charger_controller).refresh_wakeup_sources();'
    on_press:
      - script.execute: handle_battery_alert

  - platform: gpio
    id: bell_signal_gpio
    internal: true
    # Light-sleep GPIO wake is immediate; sample on the resumed main loop.
    use_interrupt: false
    pin:
      number: GPIO4
      mode: INPUT_PULLDOWN
      allow_other_uses: true
    on_state:
      - lambda: 'id(charger_controller).refresh_wakeup_sources();'
    on_press:
      - script.execute: handle_doorbell_press

switch:
  - platform: gpio
    name: "Door Opener"
    id: door_opener
    pin:
      number: GPIO14
      mode: OUTPUT
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - delay: 5s
      - switch.turn_off: door_opener

  - platform: template
    name: "LoRa Pairing Mode"
    id: lora_pairing_mode
    icon: "mdi:link-plus"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - logger.log: "LoRa pairing mode enabled"
      - delay: 60s
      - switch.turn_off: lora_pairing_mode
    on_turn_off:
      - logger.log: "LoRa pairing mode disabled"

text_sensor:
  - platform: version
    name: "ESPHome Version"
    disabled_by_default: true
  - platform: openthread_info
    ip_address:
      name: "Thread IP"
      disabled_by_default: true
    role:
      name: "Thread Role"
      disabled_by_default: true
    network_name:
      name: "Thread Network"
      disabled_by_default: true

script:
  - id: handle_doorbell_press
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(charger_controller).accept_bell_press();'
          then:
            - binary_sensor.template.publish:
                id: bell_signal
                state: true
            - if:
                condition:
                  api.connected:
                then:
                  - homeassistant.event:
                      event: esphome.doorbell_ring
                      data:
                        device: esphome-rf-doorbell
                        timestamp: !lambda 'return id(esphome_time).now().timestamp;'
                  - homeassistant.action:
                      service: notify.notify
                      data:
                        title: "Doorbell"
                        message: "Someone is at the door!"
                else:
                  - logger.log:
                      level: WARN
                      format: "Doorbell rang while HA disconnected; event not queued"
            - delay: 2s
            - binary_sensor.template.publish:
                id: bell_signal
                state: false

  - id: handle_battery_alert
    mode: single
    then:
      - logger.log: "Battery alert triggered"
      - component.update: fuel_gauge
      - lambda: |-
          id(fuel_gauge).dump_alert_diagnostics();
          id(fuel_gauge).clear_alert_flags();
          id(charger_controller).refresh_wakeup_sources();
      - if:
          condition:
            api.connected:
          then:
            - homeassistant.action:
                service: notify.notify
                data:
                  message: "Doorbell battery low!"
          else:
            - logger.log:
                level: WARN
                format: "Battery alert while HA disconnected; notification not queued"

button:
  - platform: restart
    name: "Restart"
    disabled_by_default: true
  - platform: template
    name: "Measure Supply Voltage"
    id: measure_supply_button
    disabled_by_default: true
    icon: "mdi:flash"
    on_press:
      - component.update: charger_controller
  - platform: template
    name: "Transmit LoRa Test Packet"
    id: lora_test_button
    disabled_by_default: true
    icon: "mdi:radio"
    on_press:
      - lambda: |-
          const std::vector<uint8_t> packet{0xFF, 0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07};
          const auto result = id(lora_transceiver).transmit_packet(packet);
          if (result == esphome::sx126x::SX126xError::NONE) {
            ESP_LOGI("lora_test", "LoRa test packet transmitted (%u bytes)", static_cast<unsigned>(packet.size()));
          } else if (result == esphome::sx126x::SX126xError::TIMEOUT) {
            ESP_LOGE("lora_test", "LoRa test packet transmit timed out");
          } else {
            ESP_LOGE("lora_test", "LoRa test packet transmit rejected: invalid params");
          }
